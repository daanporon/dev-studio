# bun 1.4.4 ignores a `[test] timeout` key, so the 30 s per-test default (U233) is set in the preload below
# (setDefaultTimeout); a hung test still fails, only later.
[test]
# Tests never scan the host's real session logs: DS_TOKEN_DIR defaults to an empty temp dir (KTD4).
# A fresh test store copies a migrated template loop.db instead of replaying every migration (squad-cpu-usage U3).
preload = ["./tests/loop/preload-token-dir.ts", "./tests/loop/preload-db-template.ts"]
