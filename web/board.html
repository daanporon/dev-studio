<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script>
// The dev-studio board: renders /board.json (board.sh --json) and re-polls it every 5s in place,
// so expanded rows, scroll and an open plan survive a refresh. Read-only: actions copy a command.
const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);
const POLL_MS = 5000;

const store = {
  get(k, d) { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} },
};
const fmtAge = (min) => min == null ? "" : min >= 180 ? Math.floor(min / 60) + "h" : min + "m";
const fmtTok = (v) => {
  if (v == null) return "";
  const f = (n, u) => (n < 10 ? (Math.floor(n * 10) / 10).toFixed(1).replace(/\.0$/, "") : String(Math.floor(n))) + u;
  return v >= 1e9 ? f(v / 1e9, "G") : v >= 1e6 ? f(v / 1e6, "M") : v >= 1e3 ? f(v / 1e3, "k") : String(v);
};
const tokTip = (t, ctx) => (ctx ? "context now " + (t.ctx == null ? "?" : fmtTok(t.ctx)) + " (re-read every turn) · " : "") + "spent 7d ≈" + fmtTok(t.spent) + ": cache write " + fmtTok(t.cache_write) + " · cache read " + fmtTok(t.cache_read) + " · output " + fmtTok(t.output) + " · " + t.turns + " turns";
const hhmmss = (d) => d.toTimeString().slice(0, 8);
// "data as of 14:02:31" from a section's observed_at (epoch s); "" when it was never observed.
// A unit's CPU-hours cell, as the text board prints it: "" unmeasured, one decimal, two below 0.1.
const cpuH = (c) => (c == null ? "" : c.cpu_h > 0 && c.cpu_h < 0.1 ? c.cpu_h.toFixed(2) : c.cpu_h.toFixed(1));
const kbText = (kb) => (kb == null ? "?" : kb >= 1048576 ? (kb / 1048576).toFixed(kb >= 10485760 ? 0 : 1) + "G" : Math.round(kb / 1024) + "M");
const asOf = (t) => (t ? "data as of " + hhmmss(new Date(t * 1000)) : "");

// The loop's events as they happen (GET api/stream, server-sent): App opens one EventSource and
// re-dispatches each events row here as an "ev" event; a write waits on its row's request_done.
const bus = new EventTarget();
// Requests this page filed (POST answers 202 {id}): their request_done becomes a toast.
const mine = new Set();
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(b.error || "HTTP " + r.status), { status: r.status });
  if (b.id != null) mine.add(b.id);
  return b;
}
// The result of request `id` once the loop has done it, or null when nothing came within `ms`.
function awaitDone(id, ms = 60000) {
  return new Promise((res) => {
    const on = (e) => { const ev = e.detail; if (ev.kind === "request_done" && ev.payload && ev.payload.id === id) { off(); res(ev.payload.result || {}); } };
    const off = () => { bus.removeEventListener("ev", on); clearTimeout(t); };
    const t = setTimeout(() => { off(); res(null); }, ms);
    bus.addEventListener("ev", on);
  });
}
// A filed write's outcome: null once the loop did it (or nothing came in time), else why it failed.
// A settings draft stays until then, so a refused value is still there to fix.
let lastNote = "";   // the loop's note on the last accepted change (U32: where new squads start)
async function refusal(b) {
  const r = b && b.id != null ? await awaitDone(b.id) : {};
  lastNote = r && r.ok !== false && r.note ? String(r.note) : "";
  return r && r.ok === false ? r.error || "the loop refused it" : null;
}
// The toast for an events row, or null: requests this page filed (and every failed one), a member
// started, a unit done, a usage limit, a Studio alert, a web board the loop could not keep up, and
// the loop's own toasts (a start that failed a try, U59).
function toastOf(e) {
  const p = e.payload || {}, where = [e.squad, e.unit || e.member].filter(Boolean).join("/");
  if (e.kind === "action_pending" && p.kind === "run-switch" && mine.has(Number(String(p.episode || "").replace(/^req:/, ""))))
    return p.wait || p.retry || null;
  if (e.kind === "request_done") {
    const r = p.result || {};
    if (p.kind === "account-reset" && r.outcome && mine.has(p.id)) return "free reset: " + resetOutcome(r.outcome) + (r.detail ? " (" + r.detail + ")" : "");
    if (r.ok === false) return "request #" + p.id + " (" + p.kind + ") failed: " + (r.error || "no reason given");
    if ((p.kind === "account-add" || p.kind === "account-move") && r.text && mine.has(p.id)) return r.text;   // "already there as …", a move's plugin paths
    if (p.kind === "run-switch" && mine.has(p.id)) return r.result || "Restarted";
    return mine.has(p.id) ? "done: " + p.kind + " (request #" + p.id + ")" : null;
  }
  if (e.kind === "action_done" && p.kind === "member") return "started " + (where || "a member");
  if (e.kind === "action_done" && p.kind === "alert") return "Studio alert raised" + (where ? ": " + where : "");
  if (e.kind === "unit_done") return "unit done: " + where;
  if (e.kind === "limited") return "usage limit: " + where;
  if (e.kind === "toast") return p.text ? (e.squad ? e.squad + ": " : "") + p.text : null;   // its member is a worktree id
  if (e.kind === "service_failed") return "web board" + (p.project ? " for " + p.project : "") + " failed: " + (p.error || "no reason given");
  return null;
}
// An events row as one plain sentence: what happened, and to whom (U57). A member is named by its
// worktree's role-suffix ("builder-u8-x"), not the worktree id; a kind with no sentence of its own reads
// as its name in words plus the payload's short fields. The row's full data opens on click.
function evSentence(e) {
  const p = e.payload && typeof e.payload === "object" ? e.payload : {}, raw = typeof e.payload === "string" ? e.payload : "";
  const ROLE_LED = /^(lead|thinker|builder|reviewer|tester|researcher|studio)(-|$)/;
  const who = (m) => {
    let b = String(m || "").split("/").pop();   // ds-<project>- first: dev-studio's own folders are not studio-<role>
    // an already-short name (starts with its role) is kept: the lazy regex would cut at a role word in its slug
    b = e.project && b.startsWith("ds-" + e.project + "-") ? b.slice(e.project.length + 4) : ROLE_LED.test(b) ? b : b.replace(/^.*?-(?=(lead|thinker|builder|reviewer|tester|researcher|studio)(-|$))/, "");
    if (e.squad && b.endsWith("-" + e.squad)) b = b.slice(0, -e.squad.length - 1);
    return b;
  };
  const to = e.member ? who(e.member) : e.unit ? "unit " + e.unit : e.squad || e.project || "the loop";
  const pr = (n) => (n != null ? "PR #" + n : "the PR"), err = (x) => (x ? ": " + String(x).slice(0, 160) : "");
  const reasons = (r) => {
    const all = String(r || "").split(",").filter(Boolean), req = all.filter((x) => x.startsWith("required:")).length;
    const words = all.filter((x) => !x.startsWith("required:") && x !== "checks-running" && x !== "mergeable-unknown").map((x) => x === "conflicting" ? "conflicts" : x === "checks-failing" ? "checks failing"
      : x === "checks-running" ? "checks running" : x === "behind" ? "behind its base" : x === "changes-requested" ? "changes requested"
      : x.startsWith("threads:") ? x.slice(8) + " open thread" + (x.slice(8) === "1" ? "" : "s") : x.replace(/-/g, " "));
    if (req) words.push(req + " required check" + (req === 1 ? "" : "s") + " missing");
    return words.join(", ");
  };
  // An action's target: a role request (role:restart-role:<label>/<squad>/<name>@...) reads "restart-role <name>".
  // A member action names the role and what it does from the action's own payload (`{stop, why}`; empty for a start).
  const WHY = { limit: "its account is at its usage limit, moving it", restart: "restart", phase: "next phase", fallback: "moving it back to its first-choice account", hung: "it looks hung" };
  const memberAct = (pp) => (pp.stop ? "stop " + to + (e.squad ? " in " + e.squad : "") + (pp.why ? ": " + (WHY[pp.why] || pp.why) : "") : "start " + to + (e.squad ? " in " + e.squad : ""));
  const act = (k, subj, pp) => {
    if (k === "member" && pp) return memberAct(pp);
    const m = /^(?:role|squad):([a-z-]+):[^/]+\/(?:([^/]+)\/)?([^@]+)/.exec(String(subj || "")), sq = (x) => (x ? " in " + x : "");
    if (m) return m[1].replace(/-/g, " ") + " " + m[3] + sq(m[2] || e.squad);
    const t = String(subj || ""), id = t.startsWith(k + ":") ? " " + t.slice(k.length + 1) : "";
    return String(k || "action") + (id || (e.member || t.includes("::") ? " " + to : t ? " " + t : "")) + sq(e.squad);
  };
  // Folded tries of one stuck action (evRetries): "<what> — waiting: <wait> · tried N× since HH:MM", or its end.
  if (e.tries) {
    const rows = e.tries.rows, pl = (x) => x.payload || {}, first = rows.find((x) => x.kind === "action"), src = first && first.fold ? first.fold.acting : first;
    const base = src ? act(pl(src).kind, pl(src).subject, pl(src).payload || {}) : act(p.kind, p.subject);
    const n = e.tries.n, since = hhmmss(new Date((e.tries.since || 0) * 1000)).slice(0, 5), end = e.tries.end;
    if (end === "action_done") return base + " · done after " + n + " tries";
    if (end === "action_failed") return base + " · failed after " + n + " tries" + err(pl(rows[0]).retry || pl(rows[0]).error);
    if (end === "action_dropped") return base + " · dropped (" + (pl(rows[0]).dropped || "?") + ") after " + n + " tries";
    const w = rows.find((x) => pl(x).wait || pl(x).retry), wp = w ? pl(w) : {};
    return base + (w ? " — " + (wp.wait ? "waiting: " + wp.wait : "will retry" + err(wp.retry)) : "") + " · tried " + n + "× since " + since;
  }
  switch (e.kind) {
    case "unit_pr_blocked": return p.reasons ? pr(p.pr) + " is blocked: " + reasons(p.reasons) : pr(p.pr) + " is no longer blocked";
    case "unit_pr": return "unit " + (e.unit || "?") + " opened " + pr(p.pr) + (p.was ? " (was #" + p.was + ")" : "");
    case "unit_done": return "unit " + (e.unit || "?") + " is done" + (p.pr ? " with " + pr(p.pr) : "");
    case "unit_dispatched": return "dispatched unit " + (e.unit || "?") + (p.builder_wt ? " to " + who(p.builder_wt) : "");
    case "unit_into_merged": return "unit " + (e.unit || "?") + "'s PR merged into its base";
    case "tick_slow": return p.slow != null ? p.slow + " of " + p.ticks + " ticks were over " + p.tick_s + " s (ticks averaged " + p.avg_ms + " ms, longest " + p.max_ms + " ms)" + (p.slowest ? "; slowest step " + p.slowest.step + " (" + p.slowest.avg_ms + " ms a tick)" : "")
      : "tick " + p.tick + " took " + p.ms + " ms (target " + p.tick_s + " s)";
    case "action": return e.took ? act(p.kind, p.subject) + " · took " + e.took : "acting: " + act(p.kind, p.subject, p.payload || {});
    case "action_done": return "done: " + act(p.kind, p.subject);
    case "action_pending": return p.wait ? act(p.kind, p.subject) + " — waiting: " + p.wait : "will retry: " + act(p.kind, p.subject) + err(p.retry);
    case "action_failed": return "failed: " + act(p.kind, p.subject) + err(p.retry || p.error);
    case "action_dropped": return "dropped (" + (p.dropped || "?") + "): " + act(p.kind, p.subject);
    case "action_unhandled": return "no handler for action " + (p.kind || "?");
    case "member_requested": return (p.by || "someone") + " asked for a " + p.role + (p.suffix ? " for " + p.suffix : "");
    case "member_started": return "started " + to + (p.model ? " on " + p.agent + ":" + p.model : "") + (p.account ? " (account " + String(p.account).slice(0, 8) + ")" : "");
    case "member_account": return to + " now runs on account " + String(p.to || p.account || "?").slice(0, 8);

// "2h" / "3d" since an epoch-seconds mtime; "" when unknown.
const docAge = (t) => { if (!t) return ""; const m = Math.max(0, Math.floor((Date.now() / 1000 - t) / 60)); return m < 60 ? m + "m" : m < 48 * 60 ? Math.floor(m / 60) + "h" : Math.floor(m / 1440) + "d"; };

function Docs({ s, onPlan, closed, toast, atArchive }) {

// The confirm for "Take back approval": says what happens (counts from the board data), asks a short why, files

function RevokePlan({ s, p, toast, onClose }) {

function Graph({ text, id }) {
  const ref = useRef(null);
  useEffect(() => {
    let live = true;
    mermaidP = mermaidP || import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs").then((m) => {
      m.default.initialize({ startOnLoad: false, theme: "dark", flowchart: { curve: "basis" } }); return m.default; });
    mermaidP.then((m) => m.render("g-" + id.replace(/[^A-Za-z0-9]/g, "_") + "-" + Date.now(), text))
      .then(({ svg }) => { if (live && ref.current) ref.current.innerHTML = svg; })
      .catch(() => { if (live && ref.current) { ref.current.innerHTML = ""; const p = document.createElement("pre"); p.textContent = text; ref.current.appendChild(p); } });
    return () => { live = false; };

// Suspended (or a legacy on-hold park): dimmed, sorted low, its questions not counted.
const suspendedLike = (s) => s.status === "suspended" || s.status === "on-hold";
// One plain-words line per squad state: what it means, who set it, what you can do (board-data.ts EXPLAIN).
const explainText = (s) => s.explain ? s.explain.means + " (set by " + s.explain.set_by + "). You can: " + s.explain.you_can + "." : "";
// The Close squad confirm warns when units are still open: they are archived with the squad (branches are kept).
function closeConfirm(s) {
  const open = (s.units || []).filter((u) => u.status === "planned" || u.status === "dispatched");
  const warn = open.length === 0 ? "" : open.length === 1 ? (s.held > 0 ? " 1 unit is still held and will be archived with it." : " 1 unit is still open and will be archived with it.")
    : " " + open.length + " units are still held or planned and will be archived with them.";

// "2 squads · 2 working · 1 stopped · 6 parked · 1 queued": the open units by group, non-zero only.
const unitsLeftDetail = (squads, g) => [squads + (squads === 1 ? " squad" : " squads"), ...["working", "stopped", "parked", "queued"].filter((k) => g[k] > 0).map((k) => g[k] + " " + k)].join(" · ");

// Stuck and needs-you counts from the Flow (board.json `flow`); nothing for a squad without an entry.
// A stuck or needs-you unit leaves "working", so the segments still sum to the total.
function flowStats(s, flow) {
  const f = flow && flow.squads && flow.squads[s.label + "/" + s.topic];
  if (!f) return {};
  return { stuck: f.stuck, slow: f.slow, longestStuck: f.longest_stuck_s, needsYou: f.needs_you, lastMergeAt: f.last_merge_at };
}

// Per-squad numbers the table and tiles share.
// "9m", "2h 40m": a span in seconds as the Flow cards show it.
const fmtSpan = (sec) => { const m = Math.floor(sec / 60); return m < 1 ? "<1m" : m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : ""); };
// The unit's Flow card as "fixing · 9m" (its group for Building and PR open, its stage otherwise); "" without one.
function flowLabel(card) {
  if (!card) return "";
  const what = (card.stage === "building" || card.stage === "pr_open" || card.stage === "queued") && card.group ? card.group : card.stage.replace("_", " ");
  return card.in_stage_s == null ? what : what + " · " + fmtSpan(card.in_stage_s);
}
const STOPPED = ["paused", "pausing", "resuming", "suspended", "gone"];
// The one bar segment of a unit (null: cancelled, not on the bar). Its Flow card's stuck and needs-you win.
function segmentOf(x, card) {
  if (x.state === "cancelled") return null;
  if (x.state === "done") return "merged";
  if (card && card.stuck) return "stuck";
  if (card && card.needs_you) return "needs";
  if (x.parked) return "parked";
  if ((card && card.paused) || STOPPED.includes(x.state)) return "stopped";
  return x.state === "ready" || x.state === "blocked" || x.state === "held" ? "queued" : "working";
}
function stats(s, flow) {
  const u = s.units || [];
  const prOpen = (s.prs || []).filter((p) => p.status !== "merged" && p.status !== "closed");
  const inFlow = flow && flow.squads && flow.squads[s.label + "/" + s.topic];
  const cards = new Map((inFlow ? flow.cards || [] : []).filter((c) => c.project === s.label && c.squad === s.topic).map((c) => [c.slug, c]));
  const seg = { merged: 0, working: 0, stuck: 0, needs: 0, stopped: 0, parked: 0, queued: 0 };
  let gone = 0, parkedHeld = 0;
  for (const x of u) {
    const k = segmentOf(x, cards.get(x.slug));
    if (!k) continue;
    seg[k]++;

    if (k === "parked" && x.parked === "held") parkedHeld++;

    total: u.filter((x) => x.state !== "cancelled").length, merged: seg.merged, seg, gone, parkedHeld,
    ciRunning: (s.prs || []).filter((p) => p.status === "running").length,
    drafts: prOpen.filter((p) => p.status === "draft").length,
    failing: prOpen.filter((p) => p.status === "failing").length,
    ...flowStats(s, flow),
    needs: !suspendedLike(s) && ((s.questions || []).length + (s.proposals || []).length > 0 || s.display_status === "waiting-on-you" || s.status === "blocked"),

}

function LeadCell({ s }) {
  const lead = (s.members || []).find((m) => m.role === "lead");
  if (lead && lead.pause && lead.pause.state !== "active") return html`<span class="lead warn" title=${lead.pause.reason}>${pauseLabel(lead.pause.state)}</span>`;
  if (lead && lead.limited) return html`<span class="lead bad" title=${lead.limited.line}>usage limit</span>`;
  if (s.display_status === "waiting-on-you") return html`<span class="lead warn">waiting on you</span>`;

function UnitsCell({ st }) {
  if (!st.total) return html`<div><div class="bar"></div><div class="ucount">no units yet</div></div>`;
  const pct = (x) => (100 * x / st.total) + "%";
  // An archived row has no segments, only its merged count.
  const g = st.seg || { merged: st.merged };
  const n = (k) => g[k] || 0;
  const sw = (c) => html`<i class=${"sw " + c}></i>`;
  const bit = (c, text) => html`<span>${sw(c)}${text}</span>`;
  const bits = [bit("d", st.merged + " of " + st.total + " merged")];
  if (n("working")) bits.push(bit("w", n("working") + " working"));
  if (n("stuck")) bits.push(bit("s", html`<span class="bad">${n("stuck")} stuck${st.longestStuck ? " " + fmtSpan(st.longestStuck) : ""}</span>`));
  if (st.slow) bits.push(html`<span class="warn">${st.slow} slow</span>`);
  if (n("needs")) bits.push(bit("n", html`<span class="warn">${n("needs")} needs you</span>`));
  if (n("stopped")) bits.push(bit("x", n("stopped") + " stopped"));
  if (st.gone) bits.push(html`<span class="bad">${st.gone} gone</span>`);
  if (n("parked")) {
    const behind = n("parked") - st.parkedHeld;
    const why = [st.parkedHeld && st.parkedHeld + " held", behind && behind + " behind them"].filter(Boolean).join(", ");
    bits.push(bit("p", n("parked") + " parked" + (behind ? " (" + why + ")" : "")));
  }
  if (n("queued")) bits.push(bit("q", n("queued") + " queued"));
  if (st.lastMergeAt) bits.push("last merge " + fmtSpan(Math.max(0, Date.now() / 1000 - st.lastMergeAt)) + " ago");
  return html`<div><div class="bar"><i class="d" style=${{ width: pct(n("merged")) }}></i><i class="w" style=${{ width: pct(n("working")) }}></i><i class="s" style=${{ width: pct(n("stuck")) }}></i><i class="n" style=${{ width: pct(n("needs")) }}></i><i class="x" style=${{ width: pct(n("stopped")) }}></i><i class="p" style=${{ width: pct(n("parked")) }}></i><i class="q" style=${{ width: pct(n("queued")) }}></i></div>
    <div class="ucount">${bits.map((b, i) => html`<span key=${i}>${i ? " · " : ""}${b}</span>`)}</div></div>`;
}

const UNIT_KEY = [["d", "merged"], ["w", "working"], ["s", "stuck"], ["n", "needs you"], ["x", "stopped"], ["p", "parked: waits on you (Release, or approve the plan)"], ["q", "queued: starts by itself"]];

function PrsCell({ s, st }) {

const dayOf = (e) => e ? new Date(e * 1000).toISOString().slice(0, 10) : "?";

// A question's one-line text: a bare http(s) URL is a link, and #<n> is one when the squad has a repo slug (U87).
// Not a PR reference: a plan path, an issue key such as PRD-18424, a unit, or a bare # with no number.
function linkedQ(text, slug) {
  if (text == null) return text;
  const re = /(https?:\/\/[^\s<>"`*]+)|(?<![A-Za-z0-9_.])#(\d{2,})\b/gi;
  const s = String(text);
  const out = [];
  let last = 0, m;
  while ((m = re.exec(s))) {
    const shown = m[1] ? urlTail(m[1])[0] : m[0];
    if (m[1] ? !/^https?:\/\/./i.test(shown) : !slug) continue;
    if (m.index > last) out.push(s.slice(last, m.index));
    out.push(html`<a key=${m.index} href=${m[1] ? shown : "https://github.com/" + slug + "/pull/" + m[2]} target="_blank" rel="noopener" onClick=${(e) => e.stopPropagation()}>${shown}</a>`);
    last = m.index + shown.length;
  }
  if (!out.length) return text;
  if (last < s.length) out.push(s.slice(last));
  return out;
}

// A question's markdown as one plain line, for list rows and tooltips, so they never show raw markers.
// A GFM table (found as mdToHtml finds it) loses its separator row; each other row reads "a · b".
function mdPlain(text) {
  if (text == null) return text;
  const lines = String(text).split("\n");
  const cells = (ln) => ln.trim().replace(/^\|/, "").replace(/(?<!\\)\|$/, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  const sepRow = (ln) => ln != null && ln.includes("|") && cells(ln).every((c) => /^:?-{3,}:?$/.test(c));
  const row = (ln) => cells(ln).filter(Boolean).join(" · ");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].includes("|") || !sepRow(lines[i + 1])) { out.push(lines[i]); continue; }
    out.push(row(lines[i]));
    for (i += 2; i < lines.length && lines[i].trim() !== "" && lines[i].includes("|"); i++) out.push(row(lines[i]));
    i--;
  }
  return out.join("\n").replace(/\[([^\]]+)\]\(https?:\/\/[^)\s]+\)/gi, "$1").replace(/^[ \t]*(?:#{1,6}|[-*+])[ \t]+/gm, "")
    .replace(/\*\*|`/g, "").replace(/\s*\n\s*/g, " ").trim();
}

// A question's text, drawn like a chat reply. Soft mode keeps a single newline as a line break; mdToHtml escapes first.
function QMd({ cls, text, slug }) {
  return html`<div class=${"md qmd " + cls} dangerouslySetInnerHTML=${{ __html: mdToHtml(text, true, slug) }}></div>`;
}

// studio(): close and start file a request the Studio runs (POST /api/request: a requests row the loop
// writes out as the Studio's request file, shown under "Waiting for the Studio" until it is deleted).
// restart, suspend, resume and reload write the loop's wishes themselves and answer {action, wishes}.
// The page runs nothing itself.
async function studio(body, toast, ask) {
  if (ask && !confirm(ask)) return false;
  const say = (m) => { toast(m); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast(null), 4000); };
  try {
    const b = await post("api/request", body);
    const n = b.wishes, plural = (w, k) => k + " " + w + (k === 1 ? "" : "s");
    say(body.action === "restart" ? "asked the loop: restart " + plural("role", n) + (body.topic ? " of " + body.topic : "")
      : body.action === "reload" ? "asked the loop: " + plural("member", n) + " re-read their instructions (the Studio when it is idle)"
      : b.wishes != null ? "asked the loop: " + body.action + " " + body.topic
      : "asked the Studio (request #" + b.id + ")");
    return true;
  } catch (e) { say("not sent: " + (e.message || e)); return false; }
}

// The dev-studio update banner (board-update-button U3): reads `data.update` (the observed_update row),
// and its press files the `update` request the loop runs (`u.run` is its progress).
const NEED_LINE = (n, w) => n === "restart" ? w + " worker" + (w === 1 ? "" : "s") + " restart once idle" : n === "reload" ? w + " worker" + (w === 1 ? "" : "s") + " re-read their instructions, no restarts" : "no worker restarts";
const CLASS_WORD = { skills: "skills", instructions: "instructions", code: "code" };
const classText = (cs) => { const w = (cs || []).map((c) => CLASS_WORD[c] || c); return w.length > 1 ? w.slice(0, -1).join(", ") + " and " + w[w.length - 1] : w[0] || "code"; };
// The commits button: the new commits with their class tags in a dialog (board-actions-as-wishes U2), so the banner does not grow.
function UpdateCommits({ u, onClose }) {

// remove-project U4: "Remove project". Opening it asks what blocks the removal; with nothing in the way it
// files the request once the project's name is typed exactly.
function RemoveProject({ label, onClose, onFiled }) {
  const [info, setInfo] = useState(null), [typed, setTyped] = useState(""), [err, setErr] = useState(""), [sending, setSending] = useState(false);
  const field = useRef(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const r = await fetch("api/remove-project?project=" + encodeURIComponent(label), { cache: "no-store" });
        const b = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(b.error || "HTTP " + r.status);
        if (alive) setInfo(b);
      } catch (e) { if (alive) setErr("the blockers could not be read: " + (e.message || e)); }
    })();
    return () => { alive = false; };
  }, []);
  useEffect(() => { const k = (e) => { if (e.key === "Escape") onClose(); }; addEventListener("keydown", k); return () => removeEventListener("keydown", k); }, []);
  const blockers = (info && info.blockers) || [], clear = !!info && !blockers.length && info.removing == null;
  const ok = clear && typed === label && !sending;
  useEffect(() => { if (clear && field.current) field.current.focus(); }, [clear]);
  const go = async (e) => {
    e.preventDefault();
    if (!ok) return;
    setSending(true); setErr("");
    try { const b = await post("api/remove-project", { project: label, confirm: typed }); onFiled(b.id, info); }
    catch (x) { setErr(x.message || String(x)); setSending(false); }
  };
  return html`<div class="modal" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <form class="mbox rmproj" style=${{ width: "min(560px,100%)" }} role="dialog" aria-modal="true" aria-label=${"Remove project " + label} onSubmit=${go}>
      <div class="mhd">Remove project ${label}<span class="sp"></span><button type="button" class="btn sm mclose" onClick=${onClose}>✕</button></div>
      <div class="qbody">
        <p>Its Studio, board and services are stopped, and its folder and database rows are archived. The repo clone stays.</p>
        ${!info && !err && html`<p class="mut">Checking what blocks it…</p>`}
        ${info && info.removing != null && html`<p class="rm-already">It is already being removed (request ${info.removing}).</p>`}
        ${blockers.length > 0 && html`<p><b>It cannot be removed yet:</b></p>
          <ul class="rm-blockers">${blockers.map((b, i) => html`<li key=${i}>${b.text}${b.clear && html`<div>clear: <code>${b.clear}</code></div>`}</li>`)}</ul>`}
        ${clear && html`<label>Type <b>${label}</b> to confirm<br/><input ref=${field} class="rm-confirm" type="text" style=${{ width: "100%" }} autocomplete="off" autocapitalize="off" spellcheck="false" value=${typed} onInput=${(e) => setTyped(e.target.value)} /></label>`}
      </div>
      <div class="qfoot"><span class="err" role="alert">${err}</span><span class="sp"></span>
        <button type="button" class="btn sm" onClick=${onClose}>Cancel</button>
        <button type="submit" class="btn sm pri rm-go" disabled=${!ok}>Remove</button></div>
    </form></div>`;
}

// A removal's step while it runs, or what stopped it. The live region is there before the text changes.

function UpdateBanner({ data, toast }) {
  const u = data.update, [show, setShow] = useState(false);
  if (!u) return null;
  const project = data.project, w = u.workers || 0, branch = u.branch || "main";
  const when = (t) => (t ? hhmmss(new Date(t * 1000)).slice(0, 5) : "never");
  const press = (_u, _x, ask) => studio({ project, action: "update" }, toast, ask);
  const others = (u.others || []).length ? " " + u.others.join(", ") + " get the new code now; their squads refresh when each project updates (their boards will offer it)." : "";
  const skillsHint = (cs) => (cs || []).includes("skills") ? " Afterwards type /reload-skills in this project's Studio." : "";
  let cls = "info", body = null, btn = null;
  const lu = u.last_update, badTry = lu && lu.outcome !== "advanced" ? lu : null;
  const tried = badTry ? html` · <span class="mono">last try ${badTry.outcome}: ${badTry.line || badTry.outcome}</span>` : null;
  const run = u.run, runWarn = run && (run.warnings || []).map((x, i) => html`<div class="mono" key=${i}>${x}</div>`);
  if (run) {
    // Two sentences, not a dash chain: "already current (fe92a55) — 25 workers on older code restart once idle; the Studio reloads".
    const short = (t) => String(t || "").replace(/\b([0-9a-f]{7})[0-9a-f]+…?/g, "$1");
    const squadsSentence = (t) => {
      const c = String(t || "").replace(/^update-squads: \[[^\]]*\] /, "").replace(/^nothing new — /, "");
      const m = c.match(/^(restart|reload)\b.*?(\d+) wish/), studio = /Studio/.test(c) ? "; the Studio reloads" : "";
      if (m) return m[2] + " workers on older code " + (m[1] === "restart" ? "restart once idle" : "reload") + studio;
      return c;
    };
    const sq = run.squads_line ? " — " + squadsSentence(run.squads_line) : "";
    if (run.state === "failed") {
      cls = "err"; body = html`<b>Dev-studio update failed:</b> <span class="mono">${run.line || run.error || "see the log"}</span>${run.log && html` · log <span class="mono">${run.log}</span>`}${runWarn}`;
      btn = html`<button class="btn blue sm" onClick=${() => press(u, null, "Runs the update again. Fix the reason: " + (run.line || run.error || "see the log") + ".")}>${"Retry"}</button>`;
    } else if (run.state === "done") body = html`<b>Dev-studio update:</b> <span class="mono" title=${(run.line || "done") + (run.squads_line ? " — " + run.squads_line : "")}>${short(run.line || "done") + sq}</span>${runWarn}`;
    else if (run.state === "waiting") body = html`<b>Dev-studio update waiting</b> — ${run.why || "another update is running"} (${run.age_min} min)${runWarn}`;
    else body = html`<b>Dev-studio update running</b> — ${run.state === "refreshing" ? "refreshing squads…" : run.state === "pulling" ? "pulling…" : "starting…"} (${run.age_min} min)${runWarn}`;
  } else if (u.pending) {
    cls = "info";
    body = html`<b>Dev-studio update asked</b> — ${u.pending.age_min >= 10 ? html`is the Studio running? You can also run <span class="mono">/ds-update ${project}</span> there yourself.` : "waiting for the Studio."}`;
  } else if (u.state === "detached") {
    cls = "err"; body = html`<b>Can't check for dev-studio updates.</b> The checkout is detached. Check out its branch: <span class="mono">git -C ~/.dev-studio switch main</span>`;
  } else if (u.state === "no_upstream") {
    cls = "err"; body = html`<b>Can't check for dev-studio updates.</b> ${u.error || "the branch is gone from origin"}. Check out a branch that exists on origin.`;
  } else if (u.state === "fetch_failed") {
    cls = "err"; body = html`<b>Can't check for dev-studio updates.</b> <span class="mono">${(u.error || "fetch failed").slice(0, 200)}</span> (last checked ${when(u.checked_at)}).`;
  } else if (u.stale) {
    cls = "err"; body = html`<b>The dev-studio update check is stale.</b> No fresh check since ${when(u.checked_at)} — is the loop running? <span class="mono">bin/loop/loop.sh --ensure</span>`;
  } else if (u.behind > 0) {
    if (badTry) cls = "err";
    body = html`<b>Dev-studio update: ${u.behind} new commit${u.behind === 1 ? "" : "s"} on ${branch}</b> — ${classText(u.classes)} · ${NEED_LINE(u.need, w)}${tried}
      ${u.ahead > 0 && html` · <span class="muted">${u.ahead} local commit${u.ahead === 1 ? "" : "s"} not on origin</span>`}
      ${u.dirty && html` · <b>local changes in the checkout will be discarded</b>`}`;
    btn = html`<button class="btn blue sm" onClick=${() => press(u, null, "Pulls dev-studio to " + branch + " (" + u.behind + " commit" + (u.behind === 1 ? "" : "s") + ") and restarts the loop for every project. In " + project + ": " + NEED_LINE(u.need, w) + "." + others + skillsHint(u.classes))}>Update</button>`;
  } else if (u.squads_behind) {
    const sb = u.squads_behind;
    if (badTry) cls = "err";
    body = html`<b>This project's squads run an older dev-studio</b> — ${classText(sb.classes)} · ${NEED_LINE(sb.need, w)}${tried}`;
    btn = html`<button class="btn blue sm" onClick=${() => press(u, null, "Refreshes " + project + "'s squads to the current dev-studio checkout. " + NEED_LINE(sb.need, w) + "." + skillsHint(sb.classes))}>Refresh squads</button>`;
  } else if (u.last_update) {
    const l = u.last_update;
    if (badTry) {
      cls = "err";
      body = html`<b>Dev-studio update ${l.outcome}:</b> <span class="mono">${l.line || l.outcome}</span>`;
      btn = html`<button class="btn blue sm" onClick=${() => press(u, null, "Runs /ds-update " + project + " again. Fix the reason first: " + (l.line || l.outcome) + ".")}>Retry</button>`;
    } else body = html`<b>Dev-studio update:</b> <span class="mono">${l.line || l.outcome}</span>`;
  } else return null;
  return html`<div class=${"banner " + cls} id="ds-update" role="status"><span>${cls === "err" ? "⚠" : "↻"}</span><div class="t">${body}</div>
    <div class="ubtns">${u.behind > 0 && !run && !u.pending && u.state === "ok" && !u.stale && html`<button class="btn sm" onClick=${() => setShow(true)}>Show commits</button>`}${btn}</div>
    ${show && html`<${UpdateCommits} u=${u} onClose=${() => setShow(false)} />`}</div>`;
}

// Answers already sent, by the asking: "<label>/<topic>/<id>@<since>" -> "HH:MM" (`akey`; an item with no
// `since`, a Studio alert or a brief, has the id-only key). An asking is the question's id plus the time it was
// asked: a question asked again under the same id is a new asking and starts unmarked. A key is kept until its
// item leaves the board data (`pruneSent`), so a re-render or the other copy of the form doesn't offer Send again.
const sentQ = new Map();
const askingKey = (k, since) => (k && since ? k + "@" + since : k);
// Done rows whose close request was accepted: "<label>/<topic>" (`closeKey`); the row is hidden at once and the
// mark goes when the row leaves the data.
const closingQ = new Set();
const closeKey = (n) => n.label + "/" + n.squad;
const pruneSent = (data) => { // drop the marks of askings no longer on the board (Needs-you items and loop notes)
  const live = new Set([...(data.needs_you || []).map(akey), ...(data.loop_notes || []).map((n) => n.project + "/_studio/" + n.id)]);
  for (const k of [...sentQ.keys()]) if (!live.has(k)) sentQ.delete(k);
  const rows = new Set((data.needs_you || []).filter((n) => n.kind === "done").map(closeKey));
  for (const k of [...closingQ]) if (!rows.has(k)) closingQ.delete(k);
};
// A Needs-you item the operator already acted on is hidden at once (before the loop has acted and the next refresh).
const cardGone = (n) => (n.id && sentQ.has(akey(n))) || (n.kind === "done" && closingQ.has(closeKey(n)));
// The one list of a Needs-you item's actions, read by its card, by the window the card opens and by the question
// window: [{key, label, cls, opens?, card?, confirm?}] in the order shown. `opens` actions only open a window (a card
// shows them, the window it opened does not); `card: false` is for the question window only. Running one is
// `runCardAction` in App; the window it is in closes after any of them.
const windowActions = (n, data) => cardActions(n, data).filter((a) => !a.opens && a.card !== false);
function cardActions(n, data) {
  const out = [];
  if (/^brief-/.test(n.id || "")) return [{ key: "read", label: "Read", cls: "btn sm" }];
  if (n.debrief) return [{ key: "open-debrief", label: "Open", cls: "btn sm", opens: true },
    { key: "mark-read", label: "Mark read", cls: "btn sm pri", answer: (n.options || [])[0] || "Mark read" }];
  if (n.kind === "done") {
    const sq = ((data && data.squads) || []).find((s) => s.topic === n.squad && (!n.label || s.label === n.label));
    if (sq && sq.debrief) out.push({ key: "open-debrief", label: "Open debrief", cls: "btn sm", opens: true });
    out.push({ key: "show", label: "Open", cls: "btn sm", opens: true });
    if (n.act) out.push({ key: "act", label: n.act.label, cls: "btn" + (n.act.action === "close" ? " red" : ""), act: n.act });
    return out;
  }
  if (n.squad === "_studio") {
    if (n.card_squad) out.push({ key: "show", label: "Show squad", cls: "btn sm" });
    if (n.act) out.push({ key: "act", label: n.act.label, cls: "btn" + (n.act.action === "close" ? " red" : ""), act: n.act });
    out.push({ key: "dismiss", label: "Dismiss", cls: "btn sm" });
    return out;
  }
  if (n.doc) out.push({ key: "open-doc", label: docLabel(n), cls: "btn sm", opens: true });
  out.push({ key: "answer", label: "Answer", cls: "btn sm" });
  out.push({ key: "show", label: "Show squad", cls: "btn qsec", card: false });
  if (n.act) out.push({ key: "act", label: n.act.label, cls: "btn" + (n.act.action === "close" ? " red" : ""), act: n.act, card: false });
  return out;
}
// POST /api/answer: the question is answered at once and the loop types it into the asking agent's
// terminal; records it in sentQ.
async function sendAnswer(label, topic, id, answer, since) {
  await post("api/answer", { project: label, topic, id, answer, ...(since ? { since } : {}) });
  const at = hhmmss(new Date()).slice(0, 5); sentQ.set(askingKey(label + "/" + topic + "/" + id, since), at); return at;
}
// U6: Dismiss all handles each note on its own. A 409 (the note is not open, or already dismissed) counts as
// dismissed: it is marked in sentQ so it hides, and the rest go on. Any other error is counted for one toast.
async function dismissEach(list, send = sendAnswer) {
  let failed = 0, last = "";
  for (const n of list) {
    try { await send(n.project, "_studio", n.id, ""); }
    catch (e) {
      if (e && e.status === 409) sentQ.set(n.project + "/_studio/" + n.id, hhmmss(new Date()).slice(0, 5));
      else { failed++; last = String((e && e.message) || e); }
    }
  }
  return { failed, last };
}
// A note's title as the card text has it: "<squad> · <role>: <title>"; the squad and role show on line 1, so strip them.
const noteSplit = (n) => { const m = String(n.title || "").match(/^(?:(.+?) · )?(?:([a-z-]+): )?([\s\S]*)$/); return { role: m && m[2] || "", title: m ? m[3] : n.title }; };
const noteTitle = (n) => noteSplit(n).title;
// True when a Needs-you row's title already shows its text. An untitled question's title is cut from its text the way
// shortTitle does it (bin/board/needs-rules.ts: one line, paths cut to file names, "…" when cut short).
const textInTitle = (n) => {
  if (mdPlain(n.text) === mdPlain(n.title)) return true;
  const flat = String(n.text).replace(/\s+/g, " ").trim().replace(/(^|\s)~?\/\S*\/([^\s/]+)/g, "$1$2");
  return n.titled === false && flat.startsWith(String(n.title).replace(/…$/, ""));
};
const noteRole = (n) => noteSplit(n).role || n.unit || "";
// U2: a Studio card's one action button: the same Studio request as the squad card's buttons; it does not dismiss the card.
function ActBtn({ n, toast }) {
  const a = n.act, ask = a.action === "close" || a.action === "suspend" ? a.label + " (" + a.topic + ")?" : null;
  return html`<button class=${"btn" + (a.action === "close" ? " red" : "")} onClick=${(e) => { e.stopPropagation(); studio({ project: n.label || n.project, action: a.action, topic: a.topic }, toast, ask); }}>${a.label}</button>`;

// U1: Studio cards that are loop status, not asks: a closed toggle row at the bottom of Needs-you.

  const [busy, setBusy] = useState(false);

  return html`<div class="lnbox">
    <div class="lnrow" onClick=${() => setOpen(!open)}><span>${open ? "▾" : "▸"} ${notes.length} loop note${notes.length === 1 ? "" : "s"}</span>
      <span class="hint">things the loop is watching; most clear themselves, the rest after a day</span><span class="sp"></span>
      ${open && squads.length > 1 && html`<select class="sm" value=${sq} onClick=${(e) => e.stopPropagation()} onChange=${(e) => setSq(e.target.value)}>

// The crew row's status dot: red = stuck until someone acts, amber = held or in transition, otherwise the
// member's run state. First match wins; `why` is the tooltip so the reason is not colour-only.
function crewDot(s, m) {
  const lead = m.role === "lead" && s.lead && s.lead.verdict;
  const p = m.pause && m.pause.state !== "active" ? m.pause : null;
  const bad = (why) => ({ cls: "bad", why }), amber = (why) => ({ cls: "warnd", why });
  if (m.limited && !m.limited.switching) return bad("usage limit" + (m.limited.line ? ": " + m.limited.line : ""));
  if (lead) return bad(lead === "unreachable" ? "Lead unreachable: the loop cannot deliver Run mail; it needs a restart"
    : lead === "hung" ? "Lead hung: working with no output past the hung limit" : "Lead " + lead + ": idle with Run mail unread past the silent limit");
  if (m.state === "gone") return bad("gone: no live session");
  if (m.limited) return amber("usage limit: moving to another account");
  if (p) return amber(pauseLabel(p.state) + (p.reason ? ": " + p.reason : ""));
  if (m.stop_checkpoint) return amber("restart pending: " + (STOP_WHY[m.stop_checkpoint.why] || m.stop_checkpoint.why));
  if (m.state === "⚠ settled") return amber("dispatch settled: waiting on the Lead");
  if (m.terminals > 1) return amber(m.terminals + " live sessions in one worktree");
  if (m.state === "unplaced") return amber("no worktree yet");
  return { cls: ({ working: "working spin", waiting: "waiting", done: "done" }[m.state] || ""), why: "" };
}

function RestartMember({ s, m, toast }) {
  const [busy, setBusy] = useState(false);
  if (!["lead", "thinker", "builder", "tester", "reviewer", "researcher"].includes(m.role) || !m.wt) return null;
  // A done or failed squad is still in use until archived, so it restarts too (the server refuses the same list).
  const why = ["suspended", "on-hold"].includes(s.status) ? "squad is " + s.status + ": resume it first"
    : ["closed", "gone"].includes(s.status) ? "squad is " + s.status
    : m.pause && m.pause.state !== "active" ? "role is " + m.pause.state + ": use Resume role"
    : m.stop_checkpoint || ((m.wish && m.wish.pending) || []).some((p) => p.wish === "restart") ? "restart already pending" : "";
  const restart = async () => {
    const ask = "Restart " + m.label + "?" + (m.state === "working" ? " The start waits for its turn to end." : "");
    if (!confirm(ask)) return;
    setBusy(true);
    const say = (text) => { toast(text); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast(null), 6000); };
    try {
      const b = await post("api/restart", { project: s.label, topic: s.topic, wt: m.wt, role: m.role });
      say("restart requested (request #" + b.id + ")");
    } catch (e) { say("not sent: " + (e.message || e)); }
    finally { setBusy(false); }
  };
  return html`<button class="btn sm" disabled=${busy || !!why} title=${why || "Restart this member: the loop stops it and starts it fresh"} onClick=${restart}>Restart</button>`;
}

  }, []);
  const rows = data ? data.roles.filter((x) => m.role && (x.role === m.role || x.role.startsWith(m.role + "-"))) : [];
  const roster = rows.flatMap((x) => [{ agent: x.agent, model: x.model, effort: x.effort || "default" },
    ...fbRows(x.fallbacks).filter((f) => f.model).map((f) => ({ agent: f.agent, model: f.model, effort: f.effort || x.effort || "default" }))]);
  const catalog = data ? [...roster.map((r) => data.catalog.find((c) => c.agent === r.agent && c.model === r.model) || { agent: r.agent, model: r.model, label: r.agent + ":" + r.model + " (custom)", efforts: [] }),
    ...data.catalog].filter((c, i, a) => a.findIndex((x) => x.agent === c.agent && x.model === c.model) === i) : [];
  const first = roster[0];
  const cur = pk || (m.override && m.override.model ? { agent: (catalog.find((c) => c.model === m.override.model) || {}).agent || m.agent || "claude", model: m.override.model, effort: m.override.effort || "default" } : first ? { ...first } : catalog[0] ? { agent: catalog[0].agent, model: catalog[0].model, effort: "default" } : null);
  const agent = keep ? (m.agent || (first && first.agent) || "claude") : cur && cur.agent;

    if (acct.startsWith("plan:")) body.plan = acct.slice(5); else if (acct.startsWith("acct:")) body.account = acct.slice(5);

// Past answers (GET api/questions): a squad's answered questions, newest first, 50 a page.
function PastAnswers({ s }) {
  const [rows, setRows] = useState(null);
  const [older, setOlder] = useState(null);
  const [busy, setBusy] = useState(false);
  // gen: a reload (squad switch, a question answered or reopened) drops any reply still in flight.
  const gen = useRef(0);
  const load = (before) => {
    const g = before == null ? ++gen.current : gen.current;
    const q = new URLSearchParams({ project: s.label, squad: s.topic, status: "answered", limit: "50" });
    if (before != null) q.set("before", before);
    setBusy(true);
    fetch("api/questions?" + q, { cache: "no-store" }).then((r) => r.json()).then((b) => {
      if (g !== gen.current || !b.questions) return;
      setRows((r) => (before != null && r ? r.concat(b.questions) : b.questions)); setOlder(b.older);
    }, () => {}).finally(() => { if (g === gen.current) setBusy(false); });
  };
  useEffect(() => {
    load();
    const on = (e) => { const ev = e.detail; if ((ev.kind === "question_answered" || ev.kind === "question_reopened") && ev.project === s.label && ev.squad === s.topic) load(); };
    bus.addEventListener("ev", on);
    return () => { gen.current++; bus.removeEventListener("ev", on); };
  }, [s.label, s.topic]);
  if (!rows || !rows.length) return null;
  return html`<details class="box past"><summary><h3>Past answers <span>${rows.length}${older != null ? "+" : ""}</span></h3></summary>
    ${rows.map((q) => html`<div key=${q.seq} class="qrow"><span class="t" title=${mdPlain(q.question || "")}>${linkedQ(q.title || q.id, s.repo_slug)}<${QPr} pr=${q.pr} /></span>
      <span>${q.answer}</span><span class="fr">via ${q.via}</span></div>`)}
    ${older != null && html`<button class="btn sm" data-q="older" disabled=${busy} onClick=${() => load(older)}>older ›</button>`}</details>`;
}

// "system login (user@example.com) (default)" -> "user@example.com"; other labels pass through.
function acctEmail(l) { const m = /^system login \(([^)]*)\)/.exec(l || ""); return m ? m[1] : (l || "").replace(/ \(default\)$/, ""); }

  const draftCard = (d, filed) => html`<div class="fb-draft" key=${d.id}>
    <div class="fb-title"><b>${d.kind === "add-to" ? "Comment on #" + d.target : d.title}</b> <span class="mut">${d.area ? d.area + " · " : ""}${d.label || ""}</span></div>
    ${edit && edit.id === d.id ? html`<div class="fb-edit">
      ${d.kind === "issue" && html`<input class="fb-edit-title" value=${edit.title} onInput=${(e) => setEdit({ ...edit, title: e.target.value })} />`}
      <textarea class="fb-edit-body" rows="10" value=${edit.body} onInput=${(e) => setEdit({ ...edit, body: e.target.value })}></textarea>
      <div class="fb-actions"><button class="btn sm pri fb-save" disabled=${!!busy} onClick=${saveEdit}>Save</button><button class="btn sm fb-cancel" onClick=${() => setEdit(null)}>Cancel</button></div></div>`
      : html`<div class="fb-body">${d.body}</div>`}
    ${d.evidence && html`<div class="fb-evidence mut">Drafter's evidence: ${d.evidence}${d.checked_at ? " (main at " + String(d.checked_at).slice(0, 8) + ")" : ""}</div>`}
    <div class=${"fb-leak" + (d.leak === "blocked" ? " bad" : " mut")}>${fbLeak(d)}</div>
    <div class="fb-notes">${d.notes.map((n) => html`<div class="fb-note" key=${n.id}><span class="mut">note #${n.id} · ${n.project} · </span>${n.text} <span class="mut">(local text, not sent)</span></div>`)}</div>
    ${filed ? html`<div class="fb-filed">${d.url ? html`<a href=${d.url} target="_blank" rel="noopener">#${d.issue}</a>` : d.issue != null ? "#" + d.issue : d.state} <span class="mut">${d.state}${d.fix_pr != null ? " · fixed in #" + d.fix_pr : ""}</span></div>`
      : html`<div class="fb-actions">
        <button class="btn sm pri fb-post" disabled=${!!busy || !on || d.leak === "blocked" || d.state === "posting"}
          title=${!on ? "Feedback is off: turn it on in Settings → Limits first" : d.leak === "blocked" ? "the leak check blocked this draft: edit it first" : "Send this to " + summary.repo}
          onClick=${() => act("post" + d.id, { action: "post", draft: d.id }, "posting draft " + d.id)}>Post</button>
        <button class="btn sm fb-edit-btn" disabled=${!!busy} onClick=${() => setEdit({ id: d.id, ...(d.kind === "issue" ? { title: d.title || "" } : {}), body: d.body })}>Edit</button>
        <button class="btn sm fb-dismiss-draft" disabled=${!!busy} onClick=${() => act("dismiss" + d.id, { action: "dismiss", draft: d.id }, "dismissed draft " + d.id)}>Dismiss</button>
        <input class="fb-target" placeholder="#N" size="5" value=${target[d.id] || ""} onInput=${(e) => setTarget({ ...target, [d.id]: e.target.value })} />
        <button class="btn sm fb-addto" disabled=${!!busy || !on || !/^#?\d+$/.test(target[d.id] || "")} title="Post this as a comment on that open issue instead"
          onClick=${() => act("add" + d.id, { action: "add-to", draft: d.id, target: Number(String(target[d.id]).replace("#", "")) }, "adding draft " + d.id + " to #" + String(target[d.id]).replace("#", ""))}>Add to #N</button></div>`}
  </div>`;
  const notes = (data && data.notes || []).filter((n) => filter === "all" || (filter === "dismissed" ? n.state === "dismissed" : !["filed", "fixed", "closed", "dismissed"].includes(n.state)));
  const noteRow = (n) => html`<div class="fb-note-row" key=${n.id}>
    <span class="fb-state mut">${fbNoteState(n)}</span> <span class="mut">#${n.id} · ${n.project}</span> <span class="fb-note-text">${n.text}</span>
    ${n.state === "dismissed" ? html`<span class="fb-actions"><button class="btn sm fb-restore" disabled=${!!busy} onClick=${() => act("restore" + n.id, { action: "restore", note: n.id }, "restoring note " + n.id)}>Restore</button></span>`
      : !["filed", "fixed", "closed"].includes(n.state) && html`<span class="fb-actions">
        <input class="fb-why" placeholder="reason (optional)" value=${why[n.id] || ""} onInput=${(e) => setWhy({ ...why, [n.id]: e.target.value })} />
        <button class="btn sm fb-dismiss-note" disabled=${!!busy} onClick=${() => act("dismissn" + n.id, { action: "dismiss", note: n.id, ...(why[n.id] && why[n.id].trim() ? { why: why[n.id].trim() } : {}) }, "dismissed note " + n.id)}>Dismiss</button></span>`}
    ${n.reason && html`<div class="mut fb-reason">${n.reason}</div>`}
  </div>`;
  const counts = { review: data ? data.review.length : (summary && summary.review) || 0, notes: data ? data.notes.length : (summary && summary.notes) || 0, filed: data ? data.filed.length : 0 };
  // Flow order. A tab shows while the project is on, for Notes always, and while it still holds something (a draft waiting after
  // the switch went off, a filed issue); a hidden chosen tab falls back to Notes.
  const shown = FB_TABS.filter(([k]) => on || k === "notes" || counts[k] > 0);
  const tab = shown.some(([k]) => k === tab0) ? tab0 : "notes";
  return html`<div class="modal" id="feedback" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="mbox set-box" role="dialog" aria-label="Feedback"><div class="mhd"><span>Feedback${on ? " · " + summary.repo : " · off"}</span><span class="sp"></span>
      <button class="btn sm mclose" title="Close (Esc)" onClick=${onClose}>✕</button></div>
      <div class="set-tabs">${shown.map(([k, l]) => html`<button key=${k} class=${"set-tab fb-tab" + (tab === k ? " on" : "")} onClick=${() => setTab(k)}>${l} ${counts[k] > 0 ? "(" + counts[k] + ")" : ""}</button>`)}</div>
      <div class="set-body fb-body-wrap">
        ${err && html`<div class="bad fb-err">${err}</div>`}
        ${!on && html`<div class="mut fb-off">Posting is off: turn <code>feedback</code> on in Settings → Limits to get drafts (they go to the repo this checkout was cloned from). Notes are still kept on this host.</div>`}
        ${!data && !err && html`<div class="mut">loading…</div>`}
        ${data && tab === "review" && (data.review.length ? data.review.map((d) => draftCard(d, false)) : html`<div class="mut fb-none">no drafts to review</div>`)}
        ${data && tab === "filed" && (data.filed.length ? data.filed.map((d) => draftCard(d, true)) : html`<div class="mut fb-none">nothing filed yet</div>`)}
        ${data && tab === "notes" && html`<div class="fb-filters">${FB_FILTERS.map(([k, l]) => html`<button key=${k} class=${"btn sm fb-filter" + (filter === k ? " pri" : "")} onClick=${() => setFilter(k)}>${l}</button>`)}</div>`}
        ${data && tab === "notes" && (notes.length ? notes.map(noteRow) : html`<div class="mut fb-none">no notes here</div>`)}
      </div></div></div>`;
}

// Settings: the project's limits (GET/POST api/limits -> limits.sh). Changes apply on the next
// sweep minute / board refresh; auto_compact_* apply when an agent is next (re)started.
const SETTINGS_TABS = [["limits", "Limits"], ["roles", "Roles"], ["skills", "Skills"], ["pins", "Pins"], ["accounts", "Accounts"]];
function Settings({ project, projects, accounts, folderOnly, adds, kinds, at, toast, onClose }) {
  const backend = ((projects || []).find((p) => p.label === project) || {}).studio_backend || "orca";
  const tabAt = (t) => (SETTINGS_TABS.some(([k]) => k === t) ? t : SETTINGS_TABS[0][0]);
  const [tab, setTab] = useState(() => tabAt(at));
  const [importing, setImporting] = useState(false);
  useEffect(() => { if (at) { setImporting(false); setTab(tabAt(at)); } }, [at]);   // `#settings/<tab>` while it is open
  const [rev, setRev] = useState(0);   // bumped by an applied import: the tabs read their rows again
  return html`<div class="modal" id="settings" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="mbox set-box" role="dialog" aria-label="Settings"><div class="mhd"><span>Settings · ${project}</span><span class="sp"></span>
      <a class="btn sm" id="settings-export" href=${"api/settings-export?project=" + encodeURIComponent(project)} download=${project + "-settings.txt"} title="Download this project's settings as a text file another project (or host) can import">Export</a>
      <button class="btn sm" id="settings-import" style=${{ marginLeft: 6 }} title="Copy settings in from a file or another project, choosing row by row" onClick=${() => setImporting(!importing)}>Import</button>
      <button class="btn sm mclose" style=${{ marginLeft: 6 }} title="Close (Esc)" onClick=${onClose}>✕</button></div>
      <div class="set-note set-backend" style=${{ margin: "8px 16px 0" }}>Backend: <b class="mono">${backend}</b> — the Studio's; new squads start on it. To change it run <code>ds up ${project} --backend &lt;name&gt;</code>; squads already running keep theirs.</div>
      ${importing ? html`<div class="set-body"><${ImportPane} project=${project} toast=${toast} onBack=${() => setImporting(false)} onApplied=${() => setRev((n) => n + 1)} /></div>` : html`<div class="set-tabs">${SETTINGS_TABS.map(([k, l]) => html`<button key=${k} class=${"set-tab" + (tab === k ? " on" : "")} onClick=${() => setTab(k)}>${l}</button>`)}</div>
      <div class="set-body" key=${rev}>${tab === "limits" && html`<${LimitsPane} project=${project} toast=${toast} />`}${tab === "roles" && html`<${RolesTab} project=${project} toast=${toast} />`}${tab === "pins" && html`<${PinsTab} project=${project} toast=${toast} />`}${tab === "skills" && html`<${SkillsTab} project=${project} toast=${toast} />`}${tab === "accounts" && html`<${AccountsPane} accounts=${accounts} folderOnly=${folderOnly} adds=${adds} kinds=${kinds} project=${project} toast=${toast} />`}</div>`}</div></div>`;
}

// Import in Settings: a source (a file, pasted export text, or another project on this host) -> the plan
// (POST api/settings-import/preview) as a table with a tick box per row -> Apply files one `settings-import`
// request with the ticked rows. A row that can't be ticked (unknown key, refused value, shell only, or
// already the same) is greyed with its reason; a project-specific one is unticked but can be ticked.
function importRowKey(r) { return r.file + "\u0000" + r.key; }
function importPicks(rows, pick) { return rows.filter((r) => pick[importRowKey(r)]).map((r) => ({ file: r.file, key: r.key, expect: r.current })); }
function importWhy(r) { return r.action === "skip" ? (r.why || "skipped") : r.action === "same" ? "same as now" : r.warn || ""; }
function ImportPane({ project, toast, onBack, onApplied }) {
  const [others, setOthers] = useState([]);
  const [from, setFrom] = useState("");
  const [text, setText] = useState("");
  const [name, setName] = useState("");
  const [plan, setPlan] = useState(null);       // {rows}
  const [pick, setPick] = useState({});         // row key -> ticked
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);         // the applied request's result
  useEffect(() => {
    fetch("api/settings-import?project=" + encodeURIComponent(project), { cache: "no-store" }).then((r) => r.json()).then((b) => setOthers(b.projects || [])).catch(() => {});
  }, [project]);
  const source = () => from ? { from } : { text, ...(name ? { name } : {}) };
  const chooseFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setText(await f.text()); setName(f.name.replace(/\.[^.]*$/, "")); setFrom(""); setPlan(null); setRes(null);
  };
  const preview = async () => {
    setErr(""); setRes(null); setBusy(true);
    try {
      const b = await post("api/settings-import/preview", { project, ...source() });
      setPlan(b.rows); setPick(Object.fromEntries(b.rows.filter((r) => r.pick && r.can_pick).map((r) => [importRowKey(r), true])));
    } catch (e) { setPlan(null); setErr(String(e.message || e)); }
    setBusy(false);
  };
  const apply = async () => {
    const picks = importPicks(plan, pick);
    if (!picks.length) { setErr("tick at least one row"); return; }
    setErr(""); setBusy(true);
    try {
      const b = await post("api/settings-import", { project, ...source(), picks });
      const r = b.id != null ? await awaitDone(b.id) : {};
      if (r && r.ok === false) setErr(r.error || "the loop refused it");
      else { setRes(r || { written: [], skipped: [], stale: [], pending: true }); setPlan(null); onApplied(); toast("imported " + ((r && r.changed) || 0) + " setting" + ((r && r.changed) === 1 ? "" : "s")); }
    } catch (e) { setErr(String(e.message || e)); }
    setBusy(false);
  };
  const ticked = plan ? importPicks(plan, pick).length : 0;
  return html`<div class="imp" role="region" aria-label="Import settings">
    <div class="set-note"><button class="btn sm" onClick=${onBack}>← Settings</button> Copy settings into <b>${project}</b>. Nothing is written until you press Apply; project-specific rows start unticked.</div>
    <div class="imp-src">
      <label>From another project <select id="imp-from" value=${from} onChange=${(e) => { setFrom(e.target.value); setText(""); setName(""); setPlan(null); setRes(null); }}>
        <option value="">—</option>${others.map((o) => html`<option key=${o} value=${o}>${o}</option>`)}</select></label>
      <label>or a file <input type="file" id="imp-file" onChange=${chooseFile} /></label>
      <textarea id="imp-text" rows="4" placeholder="or paste an export here" value=${text} onInput=${(e) => { setText(e.target.value); setFrom(""); setPlan(null); setRes(null); }}></textarea>
      <button class="btn sm" id="imp-preview" disabled=${busy || (!from && !text.trim())} onClick=${preview}>Preview</button>
    </div>
    ${err && html`<div class="set-note err" role="alert">${err}</div>`}
    ${plan && html`<div>
      ${plan.length === 0 ? html`<div class="set-note">The source has no settings.</div>` : html`<table class="imp-tab"><thead><tr><th></th><th>action</th><th>file</th><th>key</th><th>now → new</th><th>why</th></tr></thead><tbody>
        ${plan.map((r) => html`<tr key=${importRowKey(r)} class=${"imp-row " + r.action + (r.can_pick ? "" : " dim")} data-key=${r.key}>
          <td><input type="checkbox" aria-label=${"import " + r.key} checked=${!!pick[importRowKey(r)]} disabled=${!r.can_pick || busy} onChange=${(e) => setPick({ ...pick, [importRowKey(r)]: e.target.checked })} /></td>
          <td>${r.action}</td><td>${r.file}</td><td>${r.key}</td>
          <td>${r.action === "same" ? (r.current == null ? "—" : r.current) : r.action === "skip" ? (r.current == null ? "—" : r.current) + " → " + (r.value ?? r.raw ?? "—") : (r.current == null ? "—" : r.current) + " → " + (r.value == null ? "(removed)" : r.value)}</td>
          <td class="imp-why">${importWhy(r)}</td></tr>`)}</tbody></table>`}
      <div class="imp-go"><button class="btn sm" id="imp-apply" disabled=${busy || !ticked} onClick=${apply}>Apply ${ticked} row${ticked === 1 ? "" : "s"}</button></div>
    </div>`}
    ${res && html`<div class="set-note imp-res" role="status">${res.pending ? "Filed; the loop applies it on its next tick." : "Written " + (res.written || []).length + " · skipped " + (res.skipped || []).length + " · stale " + (res.stale || []).length + " (changed since the preview; preview again)."}
      ${[...(res.skipped || []), ...(res.stale || [])].map((x) => html`<div key=${x.file + x.key}>${x.key}: ${x.why || "changed since the preview"}</div>`)}</div>`}
  </div>`;
}

// A category's folded line: "<Name> · <n> settings", then only when non-zero overridden / unsaved / error.
// Env rows are never "unsaved" (the same filter as Save's dirtyKeys).
function limitGroupSummary(name, rows, draft, msg) {
  const n = rows.length, k = rows.filter((l) => l.source === "override").length;
  const j = rows.filter((l) => l.source !== "env" && !l.fileOnly && draft[l.key] !== undefined && draft[l.key] !== l.value).length;
  const e = rows.some((l) => msg[l.key]);
  return name + " · " + n + " setting" + (n === 1 ? "" : "s") + (k ? " · " + k + " overridden" : "") + (j ? " · " + j + " unsaved" : "") + (e ? " · error" : "");
}

function LimitsPane({ project, toast }) {
  const [rows, setRows] = useState(null);
  const [groups, setGroups] = useState([]);
  const [open, setOpen] = useState({});       // group -> true/false once toggled; otherwise the stored state
  const [forced, setForced] = useState({});   // group -> opened by a refused save (not stored)
  const isOpen = (g) => forced[g] || (open[g] ?? lstore.get("set:limits:" + g, false));
  const [draft, setDraft] = useState({});     // key -> typed value not yet saved
  const [msg, setMsg] = useState({});         // key -> error text
  const load = async () => {
    try {
      const r = await fetch("api/limits?project=" + encodeURIComponent(project), { cache: "no-store" });
      const b = await r.json();
      if (!r.ok) throw new Error(b.error || "HTTP " + r.status);
      setRows(b.limits); setGroups(b.groups || []);
    } catch (e) { setRows(null); setMsg({ _: String(e.message || e) }); }
  };
  useEffect(() => { load(); }, [project]);
  const say = (m) => { toast(m); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast(null), 4000); };
  const saveOne = (key, value) => post("api/limits", { project, key, value });
  const save = async (key, value) => {
    try {
      const why = await refusal(await saveOne(key, value));
      if (why) { setMsg((m) => ({ ...m, [key]: why })); return; }
      setDraft(({ [key]: _, ...d }) => d); setMsg(({ [key]: _, ...m }) => m);
      say((value === null ? key + ": reset to default" : key + " = " + value) + (lastNote ? " · " + lastNote.replace(/\n/g, " · ") : ""));
      load();
    } catch (e) { setMsg((m) => ({ ...m, [key]: String(e.message || e) })); }
  };
  const undo = async (key, id) => {
    try {
      const why = await refusal(await post("api/limits", { project, key, undo: id }));
      if (why) { setMsg((m) => ({ ...m, [key]: why })); return; }
      say(key + ": undo requested"); setTimeout(load, 1500);
    } catch (e) { setMsg((m) => ({ ...m, [key]: String(e.message || e) })); }
  };
  // One Save for every edited value; failures stay on their rows, the rest clear. Enter still saves one row.
  const dirtyKeys = rows ? rows.filter((l) => l.source !== "env" && draft[l.key] !== undefined && draft[l.key] !== l.value) : [];
  const saveAll = async () => {
    let ok = 0; const failed = [], filed = [];
    for (const l of dirtyKeys) {
      try { filed.push([l.key, await saveOne(l.key, draft[l.key])]); }
      catch (e) { failed.push(l.key); setMsg((m) => ({ ...m, [l.key]: String(e.message || e) })); }
    }
    await Promise.all(filed.map(async ([k, b]) => {
      const why = await refusal(b);
      if (why) { failed.push(k); setMsg((m) => ({ ...m, [k]: why })); return; }
      setDraft((o) => { const n = { ...o }; delete n[k]; return n; });
      setMsg((o) => { const n = { ...o }; delete n[k]; return n; });
      ok++;
    }));
    const bad = rows.filter((l) => failed.includes(l.key)).map((l) => l.group);
    if (bad.length) setForced((f) => { const n = { ...f }; for (const g of bad) n[g] = true; return n; });
    say(ok + " saved" + (failed.length ? ", failed: " + failed.join(", ") : ""));
    load();
  };
  return html`<div>
    <p class="set-note">Limits for ${project} · applies on the next sweep minute</p>
    ${msg._ && html`<div class="err">${msg._}</div>`}
    ${rows && html`<div>${groups.map((g) => { const gr = rows.filter((l) => l.group === g); return html`<details class="set-cat" key=${g} open=${isOpen(g)} onToggle=${(e) => { const o = e.currentTarget.open; if (o !== isOpen(g)) { setOpen((m) => ({ ...m, [g]: o })); setForced((f) => ({ ...f, [g]: false })); lstore.set("set:limits:" + g, o); } }}>
      <summary>${limitGroupSummary(g, gr, draft, msg)}</summary>
      <table class="lim"><thead><tr><th>Key</th><th>Value</th><th>Source</th><th>Meaning</th></tr></thead><tbody>
      ${gr.map((l) => {
        const env = l.source === "env";
        const cur = draft[l.key] ?? l.value;
        return html`<tr key=${l.key}>
          <td><code>${l.key}</code></td>
          <td>${env ? l.value
            : l.fileOnly
              ? html`<code>${l.value || "-"}</code><div class="set-note">${l.key === "feedback_repo" ? html`${l.hint}; an override, set with <code>ds config set</code> or the env` : "set with ds config export / import --project " + project}</div>`
            : l.allowed
              ? html`<select value=${cur} onChange=${(e) => setDraft((d) => ({ ...d, [l.key]: e.target.value }))}>${l.allowed.map((a) => html`<option key=${a}>${a}</option>`)}</select>`
              : html`<input type=${l.list || l.hint ? "text" : "number"} placeholder=${l.hint || ""} min="0" step="1" value=${cur} onInput=${(e) => setDraft((d) => ({ ...d, [l.key]: e.target.value }))} onKeyDown=${(e) => { if (e.key === "Enter") save(l.key, e.target.value); }} />`}
            ${!env && l.source === "override" && html` <button class="btn sm" onClick=${() => save(l.key, null)}>reset</button>`}
            <${ChangeNote} c=${l.changed} onUndo=${() => undo(l.key, l.changed.id)} />
            ${msg[l.key] && html`<div class="err">${msg[l.key]}</div>`}</td>
          <td class=${"src " + l.source}>${env ? "env — set by env var " + l.env : l.source}</td>
          <td class="mean">${l.comment}${l.key.startsWith("auto_compact_") ? " (applies at the agent's next restart)" : ""}</td></tr>`; })}
      </tbody></table></details>`; })}
    <div style=${{ marginTop: "12px" }}><button class="btn pri" disabled=${dirtyKeys.length === 0} onClick=${saveAll}>${dirtyKeys.length ? "Save " + dirtyKeys.length + " change" + (dirtyKeys.length > 1 ? "s" : "") : "Save"}</button></div></div>`}</div>`;
}

// Roles tab of Settings (GET/POST api/roles -> roles.sh). Self-contained: renders only its own
// content, so the Settings container (section or tabbed overlay) just mounts it. A change applies
// to the NEXT start of that role; running agents keep their model until restarted.
// ModelPick: agent + model as ONE select of catalog labels (so a mismatched pair can't be picked), with
// its own effort select offering only the efforts that model supports. "custom…" is a free agent:model.
function ModelPick({ catalog, agent, model, effort, onChange }) {
  const [free, setFree] = useState(false);
  const hit = catalog.find((c) => c.agent === agent && c.model === model);
  const efforts = ["default", ...new Set([...(hit ? hit.efforts : []), ...(effort && effort !== "default" ? [effort] : [])])];
  const pick = (v) => {
    if (v === "__custom") { setFree(true); return; }
    const c = catalog.find((x) => x.agent + "|" + x.model === v);
    onChange({ agent: c.agent, model: c.model, effort: c.efforts.includes(effort) ? effort : "default" });
  };
  const word = (v) => v.replace(/[^A-Za-z0-9._-]/g, "");
  return html`<span class="pick">
    ${free || (!hit && agent)
      ? html`<span class="model-free"><input style=${{ width: "70px" }} placeholder="agent" value=${agent} onInput=${(e) => onChange({ agent: word(e.target.value), model, effort })} />
          <input style=${{ width: "120px" }} placeholder="model" value=${model} onInput=${(e) => onChange({ agent, model: word(e.target.value), effort })} />
          <button class="btn sm" title="back to the catalog" onClick=${() => { setFree(false); const c = catalog[0]; onChange({ agent: c.agent, model: c.model, effort: "default" }); }}>✕</button></span>`
      : html`<select value=${agent + "|" + model} onChange=${(e) => pick(e.target.value)}>

// A role's pipeline = its own model/effort/plan first, then the serialized fallbacks.
function fbRows(s) { return (s || "").split(",").filter(Boolean).map((p) => { const [agent, model = "", effort = "default", plan = ""] = p.split(":"); return { agent, model, effort: effort === "-" ? "default" : effort, plan: plan === "-" ? "" : plan }; }); }

    const step = r.agent + ":" + r.model;

    if (r.plan) return step + ":" + (effort || "-") + ":" + r.plan;
    return step + (effort ? ":" + effort : "");

// A blank fallback effort runs at the role's effort on the same agent (bin/loop/capacity/pick.ts), so the list shows

async function saveRoleRows(rows, postOne, refusal, onRow) {
  const out = await Promise.all(rows.map(async ({ role, body }) => {

  }));
  return { ok: out.filter((o) => o[1]).length, failed: out.filter((o) => !o[1]).map((o) => o[0]) };
}

// Phone sheets above the keyboard (board-mobile-fullscreen-popups U4). iOS Safari ignores the viewport's
// interactive-widget, so its keyboard covers the bottom of a full-screen sheet (Send included). While a .modal
// sheet is open at <= 600 px, one listener on visualViewport (resize, scroll) writes the visible area to the root
// as --vvh / --vvtop, which the phone sheet rule sizes .modal by; on Android the layout already shrank and they
// change nothing. `kb-open` on the root (the visible height over 120 px under the tallest seen at this width)
// folds the footer's secondary buttons (the strip above the keyboard is a copy of the page that an overlay cannot cover, so the phone rule hides the board under a sheet); a focused field is scrolled into view inside the sheet, never the page.
// A pinch zoom (scale != 1) drops the variables. Nothing is installed without visualViewport; the listeners
// go when the last sheet closes or the width passes 600 px. Returns a teardown (the tests use it).
function keyboardSheets(win) {
  const vv = win.visualViewport, doc = win.document, root = doc.documentElement;
  const mq = vv && win.matchMedia && win.MutationObserver && win.matchMedia("(max-width:600px)");
  if (!mq || !mq.addEventListener) return () => {};
  const FIELD = "input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]),textarea,select";
  let on = false, stopped = false, full = 0, fullW = -1, obs = null;
  const clear = () => { root.style.removeProperty("--vvh"); root.style.removeProperty("--vvtop"); root.classList.remove("kb-open"); };
  // The nearest scrolling box between the field and its sheet; the field is moved into its view (block "nearest").
  const reveal = (el) => {
    const box = el && el.closest && el.closest(".modal .mbox");
    if (!box) return;
    for (let p = el.parentElement; p && p !== box; p = p.parentElement) {
      const o = win.getComputedStyle(p).overflowY;
      if ((o !== "auto" && o !== "scroll") || p.scrollHeight <= p.clientHeight) continue;
      const e = el.getBoundingClientRect(), b = p.getBoundingClientRect();
      if (e.top < b.top || e.height > b.height) p.scrollTop -= b.top - e.top + 8;
      else if (e.bottom > b.bottom) p.scrollTop += e.bottom - b.bottom + 8;
      return;
    }
  };
  const focused = () => { const a = doc.activeElement; return a && a.matches && a.matches(FIELD) && a.closest(".modal .mbox") ? a : null; };
  const update = () => {
    if (win.innerWidth !== fullW) { fullW = win.innerWidth; full = 0; }
    full = Math.max(full, win.innerHeight);
    if (Math.abs((vv.scale || 1) - 1) > 0.01) return clear();
    root.style.setProperty("--vvh", vv.height + "px");
    root.style.setProperty("--vvtop", vv.offsetTop + "px");
    const kb = full - vv.height > 120;
    root.classList.toggle("kb-open", kb);
    const f = kb && focused();
    if (f) (win.requestAnimationFrame || setTimeout)(() => reveal(f));
  };
  const onFocus = (e) => { if (e.target && e.target.matches && e.target.matches(FIELD)) reveal(e.target); };
  const sync = () => {
    const want = !stopped && mq.matches && !!doc.querySelector(".modal .mbox");
    if (want === on) return;
    on = want;
    const m = on ? "addEventListener" : "removeEventListener";
    vv[m]("resize", update); vv[m]("scroll", update); doc[m]("focusin", onFocus);
    on ? update() : clear();
  };
  // Watch for sheets only at phone width: the desktop gets no observer at all.
  const watch = () => {
    const want = !stopped && mq.matches;
    if (want && !obs) { obs = new win.MutationObserver(sync); obs.observe(doc.body, { childList: true, subtree: true }); }
    if (!want && obs) { obs.disconnect(); obs = null; }
    sync();
  };
  mq.addEventListener("change", watch); watch();
  return () => { stopped = true; mq.removeEventListener("change", watch); watch(); };
}
keyboardSheets(window);

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
