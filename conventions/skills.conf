# Which skills and start hooks each role starts with. Format: `<role> <pattern> <level> [required]  # comment`.
# role: builder|thinker|lead|tester|researcher|reviewer|review|studio, or * (every role).
# pattern: a skill name as Claude Code lists it (compound-engineering:ce-work, lavish), a prefix glob
#   (anthropic-skills:*, ds-*) or *; hook:<name> takes on|off.
# level: on | name-only (listed without its description) | user-invocable-only | off.
# Most specific wins: a role's own exact name, then its longer glob, then its own `*` (a blanket for
# that role: only review and studio set one), then the same for role `*`. `required` rules can't be
# changed by a project edit (the board's Skills tab writes `config` rows, project = the label).
# Probed 2026-11-12 on Claude Code 2.1.322: skillOverrides keys are the listed names (a plugin prefix
# works for anthropic-skills, a bare name for user/built-in skills), `name-only` drops the description,
# and --settings merges env and skillOverrides in one JSON. Compound Engineering's own skills ignore
# skillOverrides (the plugin keeps listing them in full), so their rows only guard against a future fix.
# Probed 2026-11-12 on Claude Code 2.1.322 in a project worktree (.claude/skills -> ../.agents/skills): a
# project repo's skill is keyed by its bare name; `off` and `user-invocable-only` drop it from the
# listing and `name-only` lists "- <name>" alone, so all levels work. `project:*` matches any skill
# of the project repo (a longer glob, so an exact rule for one project skill still wins).
# MCP servers (U283): `<role> mcp:<server> on|off`, globs as for skills; servers: linear-server, claude-docs,
# context-mode, easel. Probed 2026-11-17 on Claude Code 2.1.326 (init event's mcp_servers): `--settings
# '{"deniedMcpServers":[{"serverName":"<name>"}]}'` stops a user server (linear-server), a plugin server
# (plugin:context-mode:context-mode) and a claude.ai connector ("claude.ai Claude Docs") and keeps the rest.
# --strict-mcp-config drops every server, ENABLE_CLAUDEAI_MCP_SERVERS=false every connector and
# enabledPlugins=false the plugin's skills too, so none is used. Every kind can be set per session.
# Plugins (review-unit-no-receipt U1): `<role> plugin:<id> on|off`, the id as enabledPlugins keys it
# (`<name>@<marketplace>`, no glob); an `off` puts `enabledPlugins: {"<id>": false}` in the one --settings,
# which drops the plugin's skills, hooks and MCP server together. Only a plugin a rule names is set,
# and only `plugin:` rules set it (a role's `*` row reaches no plugin).
# tests/skills.sh fails when a role doc names a skill its role doesn't have required here.

