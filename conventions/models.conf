# Pickable models: what the board's Roles tab offers for a role's model and for each fallback, so an
# agent and its model are chosen together and a mismatched pair (muse + opus) can't be picked.
# Read by bin/commands/roles.sh (`list --json` -> "catalog"). Overridable per project: its models.conf rows in state/loop.db
# replaces this file whole.
#
# Columns, `|`-separated:  agent | model | label | efforts
#   - model is the alias the roster stores (e.g. `opus`), which moves with the agent's latest — so the
#     label shows the alias, never a version.
#   - efforts is the comma-separated reasoning efforts the model accepts; `-` = none (the picker then
#     offers only the default). A roster entry can still use any pair; one missing here shows as "custom".
# The muse rows are family aliases (they float to the newest visible version at each start),
# and the fallback for when muse's own catalog (~/.local/share/muse/model-catalog/*.json) is
# missing: roles.sh merges one entry per live family into the picker, and the live catalog wins
# on a clash (so efforts come from the resolved row).
# Codex ids stay exact. bin/lib/codex-models.sh merges the installed CLI's visible
# bundled models (no provider request); these rows cover older/missing CLIs.
claude | fable         | Claude · Fable    | low,medium,high,xhigh,max
claude | opus          | Claude · Opus     | low,medium,high,xhigh,max
claude | sonnet        | Claude · Sonnet   | low,medium,high,xhigh,max
muse   | muse-spark       | Muse · Spark       | minimal,low,medium,high,xhigh,max
muse   | muse-wonder      | Muse · Wonder      | minimal,low,medium,high,xhigh,max
muse   | muse-wonder-full | Muse · Wonder Full | minimal,low,medium,high,xhigh,max
codex  | gpt-6-astra      | Codex · GPT-6-Astra     | low,medium,high,xhigh,max,ultra
codex  | gpt-6.1-sol      | Codex · GPT-6.1-Sol     | low,medium,high,xhigh,max,ultra
codex  | gpt-6.1-terra    | Codex · GPT-6.1 Terra   | low,medium,high,xhigh,max,ultra
codex  | gpt-6-sol        | Codex · GPT-6-Sol       | low,medium,high,xhigh,max,ultra
codex  | gpt-6-luna       | Codex · GPT-6-Luna      | low,medium,high,xhigh,max
codex  | gpt-5.6-sol      | Codex · GPT-5.6-Sol     | low,medium,high,xhigh,max,ultra
codex  | gpt-5.6-terra    | Codex · GPT-5.6-Terra   | low,medium,high,xhigh,max,ultra
codex  | gpt-5.6-luna     | Codex · GPT-5.6-Luna    | low,medium,high,xhigh,max
codex  | gpt-5.5         | Codex · GPT-5.5        | low,medium,high,xhigh
