# Limits and thresholds. Format: `key value  # comment`, one per line.
# Override per project with bin/commands/limits.sh set <project> <key> <value> (the project's row in state/loop.db, docs/settings.md);
# an env var wins over both (the old names — DS_RESUME_MAX_CTX, DS_SWEEP_LIMIT_PCT, … — or DS_LIMIT_<KEY>).
context_warn 100000        # board amber (U95: restarts start fresh — nothing resumes under this any more)
context_compact 150000     # board red; an idle agent above this gets compacted (fallback when a role has no key below)
context_compact_lead 100000     # per-role override of context_compact for the loop's idle compaction
context_compact_thinker 120000
context_compact_builder 150000
context_compact_studio 150000
compact_idle_min 55        # minutes idle before an agent is compacted: main sessions cache for 1 h, so one woken within the hour needs none and one left idle compacts just before the cache expires (keep < 60)
compact_cooldown_min 30    # minutes between two compactions of the same agent
# Rule for auto_compact_<role>: Claude Code compacts at about the window minus 33k, and a role starts with
# 65-80k tokens already in context. Keep >= 80k of working room above that, and keep context_compact_<role>
# (the loop's idle compaction) below the trigger. tests/limits.sh guards both.
auto_compact_lead 200000   # Claude Code auto-compact window per role, tokens, set at launch (off = the agent's own)
auto_compact_thinker 200000
auto_compact_builder 200000
auto_compact_studio 200000
auto_compact_other 400000
limit_pct 100              # account usage % treated as the limit (DS_SWEEP_LIMIT_PCT)
limit_wait_max 30         # minutes: a limit whose reset is known and at most this far away is waited out, not switched (0 = always switch)
credits_hold_h 24          # hours an account out of credits (a billing error on screen, or its usage probe) stays out of every pick; ends earlier when its probe shows an allowance again or on `ds account enable`
pick_session_max 95        # picker skips an account above this session % (DS_PICK_SESSION_MAX)
pick_weekly_max 95         # ... or this weekly % (DS_PICK_WEEKLY_MAX)
unit_token_x 3             # runaway unit alert: x the median of done units of its tier (DS_UNIT_TOKEN_X)
unit_token_max 20000000    # ... or this absolute cache_write cap (DS_UNIT_TOKEN_MAX)
quiet_nudge_min 12         # minutes a working agent (never the Studio) may have no terminal output before the loop pokes it once to ask if it is stuck; the hung restart still fires at 30 min
long_step_min 60          # minutes a working agent whose command is still running (an open tool call or a background task) may have no output before the loop pokes it once; 0 = poke it as any quiet agent
max_builders -             # live Builder agents a project runs at once (U145): a start over it waits for a slot, oldest work first; - = no limit
max_light_builders 0       # extra Builder slots on top of max_builders that only units marked `Lane: light` take (needs max_builders set); a light unit may also take a free normal slot while no normal unit waits; 0 = no light lane
light_lane_cpu_h 3         # CPU-hours after which a light unit counts as normal (it keeps running; the project starts no new normal unit while normal is over max_builders)
focus_squad -              # the project's focus squad (one at most): when Builder seats are full its queued units take the next free seat, after urgent and unblocking work and inside max_builders, the one with the most open dependents first (unblock_first); the last seat of each lane still goes oldest first; set with `ds focus` or the board; - = none
unblock_first on           # on | off: on = when Builder seats are full, a queued unit that open units wait on (through the chain) takes the next free seat before an older one, after urgent, unblocking and focus work and resumes; outside the focus squad it never takes a lane's last seat; off = oldest first
builder_host_brake off     # on | off: on = no new Builder agent starts while the host crosses a machine_*_crit line (load, memory, swap, pressure); running work and other roles are never stopped (U4)
restart_rss_gb -           # idle agent whose RSS passes this many GB is restarted when idle (U153), at most once an hour; - = off
crash_window_min 10        # a Lead or Thinker whose dispatch settles or whose agent exits within this many minutes of a start crashed (U64; DS_SWEEP_CRASH_WINDOW_MIN)
expected_checks -          # checks a PR must have run before it reads ready: comma-separated context names, no spaces (- = none). Absent or only skipped reads required:<context>
compact_mode_lead compact  # compact | clear | off (off = the loop never compacts that role)
compact_mode_thinker clear    # a Thinker is cleared only when nothing is open (docs/settings.md); else compacted
compact_mode_builder compact
compact_mode_studio compact    # compact | off; the Studio's idle /compact (read by the loop from U263; off = only the studio.ctx card)
studio_move auto           # auto | ask | off; a limited Studio: auto moves it to the picked account (idle, empty prompt only), ask cards "move it" first, off only cards
auto_merge off            # merge method the loop arms auto-merge with on a merge-ready unit PR (U166; DS_LOOP_AUTO_MERGE): off | squash | merge | rebase; off = the Lead merges (KTD17)
base_update merge          # how a Builder brings a moved base into its unit branch (U182; DS_LIMIT_BASE_UPDATE): merge | rebase; merge = merge the base in, never rebase a pushed branch
github_budget_share 0.5    # share (0-1] of the hourly GitHub GraphQL budget the PR observer reads may spend; it paces its reads to it (U286). Host-wide: the smallest any project sets wins
pr_stale_min 0             # minutes a blocked PR keeps the same problem before the loop flags it stale (0 = at once, as the loop pokes)
stale_min 20              # minutes an idle Builder with an open unit and no PR sits before the loop nudges it, and again before it reports it to its Lead (0 = off) (U69; DS_SWEEP_STALE_MIN)
prompt_wait_min 20        # minutes a Builder Orca reads working sits at its prompt (transcript unchanged, worktree CPU under 5%, no review running) with only a background command open and no PR before the loop nudges it; the idle ladder follows, stale_min apart (0 = off) (builder-idle-no-pr-card U1; DS_SWEEP_PROMPT_WAIT_MIN)
stale_repoke_min 30        # minutes of quiet (no push, Builder idle at its prompt, worktree CPU under 5%, no check running) after a blocked PR's first pr-stale poke before its second comes without a push (0 = only after a push; DS_LOOP_STALE_REPOKE_MIN)
stale_lead_min 30          # minutes after a Builder's second pr-stale poke before a PR still not ready is reported to its Lead, once per red stretch (0 = never; DS_LOOP_STALE_LEAD_MIN)
stale_alert_min 60         # minutes after that Lead request before a PR still blocked raises one Studio alert for the stretch (0 = never; DS_LOOP_STALE_ALERT_MIN; U178)
required_wait_min 15       # minutes a PR waits on required:<context> alone (no human gate) with its Builder idle before one Builder poke, and again before one Lead request (0 = never; DS_LOOP_REQUIRED_WAIT_MIN; U179)
red_repoke_min 15            # minutes after a pr-news poke before a red PR whose failed check ran again and failed again gets one more (idle Builder only, at most 2 per head; 0 = never; DS_LOOP_RED_REPOKE_MIN; U214)
pick_room_pct 95           # loop picker (U9): an account has room while its real session % + the load of members placed on it in the last pick_ttl_s and of the new one stays under this
pick_load_hard 20          # ... expected session % one hard-tier member adds to its account until its use shows in the real %
pick_load_standard 10      # ... one standard-tier or untiered member
pick_load_lead 1           # ... one Lead, whatever its tier (U180; measured 2026-11-09/10: Max p90 3% in a Lead or Thinker's first 10 min, / Max scale 4)
pick_load_thinker 1        # ... one Thinker, whatever its tier (U180; same measurement)
pick_ttl_s 600             # ... seconds a placed member's load counts (U68), a held limit switch keeps its pick (U65), and a fallback stop holds its reservation (U180); members running longer are already in the real session %
fallback_return_min 15      # loop (U66): minutes between tries to move an idle member on a fallback rung back to a higher rung with room; 0 = never. One tick stops only the members whose move still fits with the tick's other moves counted (U180)
pick_floor_builder any     # lowest ladder rung a role starts on (agent:model, or any); below it the loop waits. pick_floor_<role>[_<tier>]
board_stale_ticks 12       # loop ticks (DS_LOOP_TICK_S each) after which the board shows "loop down / data as of"

# Machine panel (board U4): host levels the board colors; a metric at or above crit reads red, at or above warn amber.
machine_load_warn_pct 100   # load1 / cores x 100
machine_load_crit_pct 150
machine_mem_warn_pct 85     # memory used % ((total - available) / total)
machine_mem_crit_pct 95
machine_swap_warn_pct 50    # swap used %; a host with no swap is always ok
machine_swap_crit_pct 90      # crit also needs memory pressure (PSI mem) at or above machine_psi_warn; full swap alone is warn
machine_disk_warn_pct 85    # used % of the fullest disk
machine_disk_crit_pct 95
machine_psi_warn 10         # pressure-stall avg10 %: shows a "stalling on cpu/memory/io" note
machine_psi_crit 25
machine_outside_ram_pct 10  # Machine panel, "Outside this project": one other project's worktree or host group using this % of machine RAM or more
machine_outside_cpu_pct 200 # ... or this much CPU (100 = one core)

# Expected session load multiplier by agent + observed plan; unlisted plans use 1.
pick_load_scale_claude_Ultra 1
pick_load_scale_claude_Max   4

# Review findings below these severities go in the PR notes instead of a fix round.
review_block_severity P1          # P0 | P1 | P2 | P3; P0 and P1 block by default
review_block_severity_risky P2    # threshold for files matching review_risk_paths
review_risk_paths -               # comma-separated shell globs on repo-relative paths; - = none
# A PR gets one full review, then deltas; a delta over the line limit runs wide, on a risk path full (U138, U176).
review_delta_wide_lines 400       # a delta with more non-test executable changed lines than this runs wide (legacy review_delta_full_lines still read when this is unset)
review_skip_lenses -              # comma-separated reviewer lenses this project drops (never correctness); - = none
# Morning brief (the Studio's daily summary; sent by the loop on the host clock).
briefing_time off                 # HH:MM (24h, host clock) the morning brief is sent; off = no brief
briefing_days mon-fri             # days it is sent: daily | mon-fri | a comma list or ranges (mon,wed,fri / mon-wed,fri)
briefing_merges_lag_min 15        # minutes the merge record may end before the brief closes and still read "complete up to HH:MM" (0-120); more = partial
# The board's Flow (bin/board/flow.ts): a unit is stuck when its time in stage passes twice the
# project's typical time for that stage, but never before this many minutes.
flow_stuck_floor_min 10           # minutes; the floor under the stuck threshold
# A late card is stuck only when its Builder shows no sign of work (working, output, CPU, a review or checks
# running) for this many minutes; otherwise it reads slow. A stale card is stuck at any age.
flow_quiet_min 20                 # minutes of quiet before a late card reads stuck, not slow
refusal_needs_min 240             # minutes a "Loop action refused" card for a squad's one-off request stays a loop note before it reaches Needs-you
needs_grace_min 10                # minutes a self-healing Studio card (Agent broken, out of credits) must last before it reaches Needs-you
loop_stall_banner_n 3             # the board's amber "The loop keeps stalling" banner shows when the loop restarted this many times...
loop_stall_banner_min 60          # ...within this many minutes
expose_down_min 15                # minutes an exposed URL (ds expose) may stay down before the loop ends its entry
expose_stop_s 90                  # seconds an exposed entry's stop command (ds expose --stop) may run, 10-100; a close waits for it
expose_warn_min 5                 # minutes a member may listen on a port no ds expose entry covers before the loop tells it once (0 = off)
chat_quiet_s 10                   # seconds a member's terminal must be quiet before the loop types a board chat message into it (the Studio too; a Claude member's chat waits only on its transcript and working marker, not on output; other Studio typing, such as a move or a reload, keeps 120)
msg_chase_min 15                  # minutes a message may stay unread before the loop pokes its idle receiver once more (0 = off)
notes_cap 20                    # most notes a role keeps per project (notes.sh, 1-100); every role prints all its notes at start, so a higher cap costs context in every session of that role
msg_reply_alert_min 60            # minutes a needs-reply message may go unanswered before one Studio alert names sender, receiver and subject (0 = off)
chat_queue_min 30                 # minutes a board chat message may wait for its member to be ready before it fails with the reason
chat_files_keep_d 14              # days a board chat image is kept in state/<label>/chat-files/ (1-365); each upload prunes older ones, an upload of the same image resets its age
archive_debrief_min 10            # minutes an archive waits for the live Lead to write the final debrief before it closes with the old one (0 = off)

# Host tidy (host-disk-cleanup). A value is read whole by bin/loop/settings/limits.ts limitLine; a ` #` starts a comment, so point cleanup_on_close at a script when the command needs one. Set these with ds config export/import (docs/settings.md; limits.sh set refuses glob and command values).
host_tidy report                  # report = the Host tidy card only; apply = the loop also removes what it calls removable, re-checking each first (exactly `apply`; anything else reports)
cleanup_tmp_globs -               # comma- or space-separated absolute globs the loop may clear (wildcard in the last path segment only); - = none
cleanup_trim_globs -              # same rules: absolute globs of cache folders the loop keeps but trims inside (entries untouched cleanup_tmp_age_h, ours, not open); - = none
cleanup_tmp_age_h 48              # hours a match must be untouched before it is cleared
cleanup_on_close -                # command run in a member's worktree before the loop removes it; - = none
disk_card_free_pct 20             # a Studio card names the consumers when a disk's free share drops below this %; it clears 5 points above; 0 = off
disk_watch_paths -                # host-level (default row only): comma- or space-separated absolute paths (no .., no wildcard) the disk card sizes with du; - = none

# The hook scripts' TypeScript ports (U190): bin/hooks/{rewake-hook,picker-hook,arm-rewake,arm-picker,reassert-roles}.sh
