# Squad role roster and per-role models (U12, R22, KTD7).
# Read by the loop (its picker, bin/ds pick, and the squad fulfiller) for every start — edit here to
# add/remove roles or change models; no script edit needed. Human-readable rationale is in models.md.
#
# Columns:  name  agent  model  spawn(always|ondemand|elevate)  [effort]  [fallbacks]  [plan]
#   - exactly one role must be named `lead` (the squad's coordinator worktree).
#   - `always` roles are created at spawn; `ondemand` roles are started later.
#   - `elevate` rows never start a terminal: they name the model for a one-shot call —
#     `thinker-deep` is what the Thinker passes to ce-plan for a hard topic
#     (conventions/thinker-routing.md; effort ignored, CE's elevation sets its own), and
#     `builder-review` is what bin/review/review-unit.sh runs a hard unit's full review on;
#     every delta review and every other unit runs on `builder-review-standard`
#     (cheaper: Sonnet, medium effort; no tier counts as standard, and without that
#     row everything runs on `builder-review`).
#   - `review-leaf` is an `elevate` row, never a terminal: it names the model for the merge,
#     report and validator steps of every review (bin/review/review-unit.ts puts it in the
#     review prompt); the reviewers stay on the `builder-review` / `builder-review-standard` model.
#   - `builder-standard` is never started by name: it is the model a Builder gets when its
#     unit is tiered `standard` (conventions/plan-shape.md step d) in the ce-pipeline ship
#     mode. Everything else — hard, untagged, other modes — uses the `builder` row.
#   - `builder-<tier>-babysit` is never started by name either: once a Builder's unit PR is open
#     and the Builder is idle, the loop restarts it fresh on this row to take the PR to
#     merge-ready (bin/loop/reconcilers/phases.ts, U22). No row = the `builder-<tier>` /
#     `builder` row, as before.
#   - effort (optional 5th column) is the model's reasoning effort
#     (low|medium|high|xhigh|max); omit it for the model's default, or use `-`.
#   - fallbacks (optional 6th column; needs the effort column, `-` = default) is an ordered,
#     comma-separated `agent:model[:effort[:plan]]` list (a missing effort = the role's on the same agent, else the agent's default; pickable models: conventions/models.conf). `bin/ds pick` starts a role on its own model on
#     the account that resets soonest with room, then on each fallback in order; when nothing is free the work waits
#     for the earliest reset. No column = no model fallbacks (account picking still works).
#   - plan (optional 7th column) restricts the first step to that observed account plan.
#     Omitted or `-` means Any. Fallbacks may name it as `agent:model:effort:plan`
#     (`-` keeps default effort). Same-model steps on different plans stay separate.
#     Unknown-plan accounts match Any only; a full/missing plan falls to the next step.
#     Room uses limits.conf pick_load_scale_<agent>_<plan> (unlisted = 1).
#     Floors accept agent:model:plan; old agent:model floors stop at their first match.
#   - standing roles (lead, thinker) wake on an inbox message via the rewake Stop hook
#     (conventions/wake.md); task roles are woken by their dispatch. No per-role cadence.
#   (overridable per project, per role (U267): a project's roles.conf row in state/loop.db replaces this
#   file's row of the same role; every role it lacks runs the row here.)
#
lead       claude  sonnet always
thinker    claude  opus   always
thinker-deep claude fable elevate
# studio: the operator's Studio (U260) — never started by spawn-squad; the loop adopts, launches and moves it.
studio     claude  sonnet ondemand
builder    claude  opus   ondemand -  claude:sonnet,muse:muse-spark-1.3
builder-standard claude sonnet ondemand - claude:opus
builder-standard-babysit claude sonnet ondemand - claude:opus
builder-hard-babysit     claude sonnet ondemand - claude:opus
builder-review claude opus elevate - muse:muse-spark-1.3
builder-review-standard claude sonnet elevate medium muse:muse-spark-1.3
review-leaf claude sonnet elevate - claude:opus
reviewer   claude  fable  ondemand -  claude:opus
tester     claude  opus   ondemand
researcher claude  fable  ondemand
# A feature squad starts as Lead + Thinker. Builders are `ondemand`: the Lead spawns
# one per unit from the Thinker's plan (never before there's a plan to build). A
# testing squad also starts the Tester. All on-demand roles come from the Lead.
