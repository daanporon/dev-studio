# Every PR into main, and every push to main, runs the loop tests through tests/ci.sh.
name: tests

# No `edited` trigger, on purpose. An edit (a title, a body, a retarget) on the same head would add a newer
# `tests` run whose job is skipped, and GitHub then holds the PR BLOCKED with green checks (#12, #17).
# A retarget without a push gets no run: push, or close and reopen the PR.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# A new push cancels the older run on the same PR. A push to main cancels nothing, so each merge's run finishes.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The page tests mount web/board.html in happy-dom (tests/loop/board-mount.ts): a devDependency.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck
      # One test script per core: tests/ci.sh still prints its lines in name order.
      - name: Run tests/ci.sh
        run: CI_JOBS="$(nproc)" tests/ci.sh
